<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>نظام إدارة المخزن والديون - محلات الدباغ (إصدار مطور)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Barcode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

    :root {
      --paper: #E7DEC4;
      --paper-card: #FBF6E8;
      --paper-stripe: #F3EBD5;
      --paper-line: rgba(30,46,69,0.06);
      --ink: #1E2E45;
      --ink-soft: #6B6152;
      --border: #C9BE9C;

      --primary: #2C4368;
      --price: #24508C;
      --debt: #9B3A34;
      --success: #3F6B4F;
      --reports: #5B3C6E;
      --ai-color: #0F7A7C;
      --brass: #A9822E;

      --bg: var(--paper);
      --card: var(--paper-card);
      --text-main: var(--ink);
      --text-muted: var(--ink-soft);

      --radius: 8px;
      --shadow-sm: 0 1px 3px rgba(40,28,10,0.12);
      --font-display: 'Reem Kufi', sans-serif;
      --font-body: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    body.dark-mode {
      --paper: #0F172A;
      --paper-card: #1E293B;
      --paper-stripe: #182232;
      --paper-line: rgba(255,255,255,0.03);
      --ink: #F8FAFC;
      --ink-soft: #94A3B8;
      --border: #334155;
      --bg: var(--paper);
      --card: var(--paper-card);
      --text-main: var(--ink);
      --text-muted: var(--ink-soft);
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 31px, var(--paper-line) 32px), var(--bg);
      color: var(--text-main);
      margin: 0; padding: 0;
      direction: rtl;
    }

    #pinLockOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.98); z-index: 9999;
      display: flex; align-items: center; justify-content: center; color: #F4EBD0;
    }

    .pin-box {
      background: #1E293B; padding: 32px 28px; border-radius: 12px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.55); width: 90%; max-width: 340px; border: 1px solid var(--brass);
    }
    .pin-input {
      width: 80%; padding: 11px; font-size: 24px; text-align: center;
      border-radius: 6px; border: 1px solid #334155; background: #0F172A;
      color: #F4EBD0; letter-spacing: 10px; outline: none; margin-bottom: 16px; font-family: var(--font-mono);
    }

    header {
      background: linear-gradient(160deg, #0F172A 0%, #1E293B 100%);
      color: #F4EBD0; padding: 16px 24px; font-size: 20px; font-family: var(--font-display);
      border-bottom: 4px solid var(--brass); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }

    .container { max-width: 1400px; margin: 20px auto; padding: 0 15px; }

    #cloudStatus {
      padding: 10px; text-align: center; font-weight: 700; border-radius: var(--radius);
      margin-bottom: 18px; background: var(--card); color: var(--text-muted); font-size: 13px;
      border: 1px dashed var(--border); font-family: var(--font-mono);
    }

    .dashboard-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .dash-card {
      background: var(--card); border: 1px solid var(--border); border-inline-start: 4px solid var(--brass);
      border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow-sm);
    }
    .dash-card .label { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
    .dash-card .value { font-size: 20px; font-weight: 700; font-family: var(--font-mono); }

    .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 3px solid var(--border); }
    .tab-btn {
      flex: 1; min-width: 140px; padding: 12px; font-size: 14px; font-weight: 700;
      background: var(--card); color: var(--text-muted); border: 1px solid var(--border); border-bottom: none;
      border-radius: 8px 8px 0 0; cursor: pointer; font-family: var(--font-display); text-align: center;
    }
    .tab-btn.active { color: #FFF; background: var(--primary); border-color: var(--primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
    
    h2 { margin-top: 0; font-size: 16px; font-family: var(--font-display); border-bottom: 2px dashed var(--border); padding-bottom: 8px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    input, select, textarea {
      width: 100%; padding: 9px 11px; margin-bottom: 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13.5px; font-family: var(--font-body); background: var(--bg); color: var(--text-main);
    }

    button { width: 100%; padding: 10px; border: none; border-radius: 6px; color: white; font-weight: 700; cursor: pointer; font-size: 13.5px; font-family: var(--font-body); }
    .btn-price { background: var(--price); }
    .btn-debt { background: var(--debt); }
    .btn-success { background: var(--success); }
    .btn-reports { background: var(--reports); }
    .btn-ai { background: var(--ai-color); }
    .btn-secondary { background: var(--text-muted); color: var(--bg); }

    .table-wrapper { overflow-x: auto; margin-top: 10px; border-radius: 6px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px; text-align: center; border-bottom: 1px solid var(--border); }
    th { background: var(--primary); color: #FFF; font-weight: 600; }
    tbody tr:nth-child(even) { background: var(--paper-stripe); }

    .stock-badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .stock-low { background: #FEE2E2; color: #991B1B; }
    .stock-ok { background: #DCFCE7; color: #166534; }

    .action-btn { padding: 4px 8px; font-size: 11px; margin: 2px; width: auto; display: inline-block; }

    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); justify-content: center; align-items: center; }
    .modal-content { background: var(--card); padding: 20px; border-radius: var(--radius); width: 90%; max-width: 520px; border-top: 4px solid var(--brass); max-height: 85vh; overflow-y: auto; }

    @media print {
      body { background: #fff; color: #000; }
      header, .tabs, .btn-secondary, button, #cloudStatus, #pinLockOverlay { display: none !important; }
      .container { max-width: 100%; margin: 0; padding: 0; }
      .card { border: none; box-shadow: none; }
    }
  </style>
</head>
<body>

<!-- Lock Overlay -->
<div id="pinLockOverlay">
  <div class="pin-box">
    <h3>🔒 أدخل الرمز السري</h3>
    <input type="password" id="pinInput" maxlength="4" class="pin-input" placeholder="••••" autofocus onkeypress="if(event.key==='Enter') checkAppPin()">
    <button onclick="checkAppPin()" class="btn-success">فتح النظام</button>
  </div>
</div>

<header>
  <div>📦 نظام إدارة الدباغ - المخزن والديون</div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button onclick="window.print()" class="btn-secondary" style="width:auto; padding:5px 10px; font-size:12px;">🖨️ طباعة</button>
    <button onclick="toggleTheme()" class="btn-secondary" style="width:auto; padding:5px 10px; font-size:12px;">🌓 المظهر</button>
    <button onclick="lockSystem()" class="btn-secondary" style="width:auto; padding:5px 10px; font-size:12px;">🔒 قفل</button>
    <div style="font-size:12px; background:rgba(255,255,255,0.1); padding:4px 10px; border-radius:5px;">
