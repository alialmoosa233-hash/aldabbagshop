<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>حاسبة ومعارض الأسعار (كلفة وبيع)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #cbd5e1;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #1e3a8a;
      font-weight: 800;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .box-title {
      font-size: 13px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 8px;
    }

    .val {
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
    }

    .profit {
      color: #16a34a;
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🏷️ سعر الكلفة والبيع (الكارتون والقطعة)</h2>

  <!-- إدخالات الكلفة -->
  <div class="row">
    <div class="form-group">
      <label>كلفة الكارتون (د.ع):</label>
      <input type="number" id="costBox" placeholder="مثال: 12000" oninput="calculate()">
    </div>
    <div class="form-group">
      <label>عدد القطع بالكارتون:</label>
      <input type="number" id="boxQty" placeholder="مثال: 24" oninput="calculate()">
    </div>
  </div>

  <!-- ناتج كلفة القطعة -->
  <div class="box" style="background: #eff6ff; border-color: #bfdbfe;">
    <div class="box-title" style="color: #1d4ed8;">📌 كلفة القطعة الواحدة:</div>
    <div class="val" id="costPieceVal">0 د.ع</div>
  </div>

  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

  <!-- إدخالات البيع -->
  <div class="row">
    <div class="form-group">
      <label>سعر بيع الكارتون (د.ع):</label>
      <input type="number" id="sellBox" placeholder="مثال: 15000" oninput="calculate()">
    </div>
    <div class="form-group">
      <label>سعر بيع القطعة (د.ع):</label>
      <input type="number" id="sellPiece" placeholder="مثال: 750" oninput="calculate()">
    </div>
  </div>

  <!-- نتائج أرباح البيع -->
  <div class="row">
    <div class="box">
      <div class="box-title">ربح الكارتون:</div>
      <div class="val" id="profitBoxVal">0 د.ع</div>
      <div class="profit" id="marginBoxVal">نسبة الربح: 0%</div>
    </div>
    <div class="box">
      <div class="box-title">ربح القطعة:</div>
      <div class="val" id="profitPieceVal">0 د.ع</div>
      <div class="profit" id="marginPieceVal">نسبة الربح: 0%</div>
    </div>
  </div>
</div>

<script>
  function calculate() {
    const costBox = parseFloat(document.getElementById('costBox').value) || 0;
    const boxQty = parseFloat(document.getElementById('boxQty').value) || 0;
    const sellBox = parseFloat(document.getElementById('sellBox').value) || 0;
    const sellPiece = parseFloat(document.getElementById('sellPiece').value) || 0;

    // احتساب كلفة القطعة
    let costPiece = 0;
    if (costBox > 0 && boxQty > 0) {
      costPiece = costBox / boxQty;
      document.getElementById('costPieceVal').innerText = costPiece.toLocaleString(undefined, {maximumFractionDigits: 2}) + " د.ع";
    } else {
      document.getElementById('costPieceVal').innerText = "0 د.ع";
    }

    // احتساب أرباح الكارتون
    if (sellBox > 0 && costBox > 0) {
      const profitBox = sellBox - costBox;
      const marginBox = (profitBox / costBox) * 100;
      document.getElementById('profitBoxVal').innerText = profitBox.toLocaleString() + " د.ع";
      document.getElementById('marginBoxVal').innerText = "نسبة الربح: " + marginBox.toFixed(1) + "%";
    } else {
      document.getElementById('profitBoxVal').innerText = "0 د.ع";
      document.getElementById('marginBoxVal').innerText = "نسبة الربح: 0%";
    }

    // احتساب أرباح القطعة
    if (sellPiece > 0 && costPiece > 0) {
      const profitPiece = sellPiece - costPiece;
      const marginPiece = (profitPiece / costPiece) * 100;
      document.getElementById('profitPieceVal').innerText = profitPiece.toLocaleString(undefined, {maximumFractionDigits: 2}) + " د.ع";
      document.getElementById('marginPieceVal').innerText = "نسبة الربح: " + marginPiece.toFixed(1) + "%";
    } else {
      document.getElementById('profitPieceVal').innerText = "0 د.ع";
      document.getElementById('marginPieceVal').innerText = "نسبة الربح: 0%";
    }
  }
</script>

</body>
</html>
