<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محلات الدباغ - إدارة المنتجات</title>

  <!-- Firebase Module Script -->
  <script type="module">
    import { initializeApp } from 'https://cdn.jsdelivr.net/npm/@firebase/app@0.10.0/+esm';
    import { getAuth, signInAnonymously } from 'https://cdn.jsdelivr.net/npm/@firebase/auth@1.7.0/+esm';
    import { getDatabase, ref, onValue, push, set, remove, update } from 'https://cdn.jsdelivr.net/npm/@firebase/database@1.0.4/+esm';

    const firebaseConfig = {
      apiKey: "AIzaSyC-QqnQTbbyVFS8QFkf4CYZTcURcr9nBW0",
      authDomain: "gimi-fd7fe.firebaseapp.com",
      databaseURL: "https://gimi-fd7fe-default-rtdb.firebaseio.com",
      projectId: "gimi-fd7fe",
      storageBucket: "gimi-fd7fe.firebasestorage.app",
      messagingSenderId: "642364940251",
      appId: "1:642364940251:web:6dd47f47d500ae9ed791fe"
    };

    const app = initializeApp(firebaseConfig);
    const realAuth = getAuth(app);
    const database = getDatabase(app);

    window.firebase = {
      auth: () => realAuth,
      database: () => database,
      ref, onValue, push, set, remove, update, signInAnonymously
    };
    window.__firebaseReady = true;
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #F1F5F9; --card-bg: #FFFFFF; --border-color: #E2E8F0;
      --text-main: #0F172A; --primary: #1E3A8A; --price-blue: #2563EB;
      --success: #059669; --danger: #DC2626; --radius: 12px;
    }
    body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; direction: rtl; }
    header { background: #0F172A; color: #FFF; padding: 18px 30px; font-weight: 800; font-size: 1.2em; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
    
    /* إخفاء خيارات الإدارة عن غير المشرفين */
    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: block !important; }
    body.is-admin th.admin-only, body.is-admin td.admin-only { display: table-cell !important; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 14px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 0.95em; }
    button { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; color: #fff; font-family: inherit; }
    .btn-add { background: var(--success); width: 100%; font-size: 1em; }
    .btn-danger { background: var(--danger); padding: 5px 10px; font-size: 0.85em; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px 14px; text-align: center; border-bottom: 1px solid var(--border-color); }
    th { background: #1E293B; color: #FFF; }
    .num { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <div>🛒 محلات الدباغ - إدارة المخزون والمبيعات</div>
    <div id="adminStatus" class="admin-only" style="background: var(--success); padding: 4px 12px; border-radius: 20px; font-size: 0.75em;">وضع المشرف مفعل (Admin)</div>
  </header>

  <div class="container">

    <!-- نموذج إضافة منتج جديد (خاص بالمشرف فقط) -->
    <div class="card admin-only">
      <h3>➕ إضافة منتج جديد</h3>
      <form id="addProductForm" onsubmit="handleAddProduct(event)">
        <div class="form-grid">
          <div>
            <label>اسم المنتج:</label>
            <input type="text" id="pName" placeholder="مثال: زيت طعام 1 ليتر" required>
          </div>
          <div>
            <label>الباركود:</label>
            <input type="text" id="pBarcode" placeholder="اختر أو امسح الباركود">
          </div>
          <div>
            <label>سعر التكلفة:</label>
            <input type="number" id="pCost" placeholder="0" required>
          </div>
          <div>
            <label>سعر البيع:</label>
            <input type="number" id="pSell" placeholder="0" required>
          </div>
          <div>
            <label>الكمية بالمخزن:</label>
            <input type="number" id="pQty" placeholder="0" required>
          </div>
        </div>
        <button type="submit" class="btn-add">حفظ المنتج في قاعدة البيانات</button>
      </form>
    </div>

    <!-- جدول عرض المنتجات -->
    <div class="card">
      <h3>📦 قائمة المنتجات المخزنة</h3>
      <table>
        <thead>
          <tr>
            <th>اسم المنتج</th>
            <th>الباركود</th>
            <th>سعر التكلفة</th>
            <th>سعر البيع</th>
            <th>الكمية</th>
            <th class="admin-only">إجراءات</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <tr><td colspan="6">جاري تحميل البيانات...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const auth = window.firebase.auth();
      const db = window.firebase.database();

      // تسجيل دخول تلقائي
      window.firebase.signInAnonymously(auth).catch(console.error);

      auth.onAuthStateChanged((user) => {
        if (user) {
          // 1. فحص صلاحيات المشرف
          window.firebase.onValue(window.firebase.ref(db, 'admins/' + user.uid), (snapshot) => {
            if (snapshot.val() === true) {
              document.body.classList.add('is-admin');
            } else {
              document.body.classList.remove('is-admin');
            }
          });

          // 2. الاستماع للمنتجات وقراءتها تلقائياً
          loadProducts(db);
        }
      });
    });

    // دالة إضافة منتج جديد
    function handleAddProduct(e) {
      e.preventDefault();
      const db = window.firebase.database();

      const newProduct = {
        name: document.getElementById('pName').value,
        barcode: document.getElementById('pBarcode').value || 'بدون باركود',
        costPrice: Number(document.getElementById('pCost').value),
        sellPrice: Number(document.getElementById('pSell').value),
        qty: Number(document.getElementById('pQty').value),
        updatedAt: Date.now()
      };

      // إضافة طفل جديد تحت aldabbagh_store_final/products
      const productsRef = window.firebase.ref(db, 'aldabbagh_store_final/products');
      const newRef = window.firebase.push(productsRef);
      
      window.firebase.set(newRef, newProduct)
        .then(() => {
          alert("✅ تم إضافة المنتج بنجاح!");
          document.getElementById('addProductForm').reset();
        })
        .catch(err => alert("حدث خطأ في الإضافة: " + err.message));
    }

    // دالة عرض المنتجات في الجدول
    function loadProducts(db) {
      const productsRef = window.firebase.ref(db, 'aldabbagh_store_final/products');
      
      window.firebase.onValue(productsRef, (snapshot) => {
        const tbody = document.getElementById('productsTableBody');
        tbody.innerHTML = '';

        if (!snapshot.exists()) {
          tbody.innerHTML = '<tr><td colspan="6">لا توجد منتجات مضافة بعد.</td></tr>';
          return;
        }

        snapshot.forEach((childSnap) => {
          const key = childSnap.key;
          const p = childSnap.val();

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight:700;">${p.name}</td>
            <td class="num">${p.barcode}</td>
            <td class="num">${p.costPrice ? p.costPrice.toLocaleString() : 0} د.ع</td>
            <td class="num" style="color:var(--price-blue);">${p.sellPrice ? p.sellPrice.toLocaleString() : 0} د.ع</td>
            <td class="num">${p.qty}</td>
            <td class="admin-only">
              <button class="btn-danger" onclick="deleteProduct('${key}')">حذف</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    // دالة حذف المنتج (خاصة بالمشرف)
    function deleteProduct(key) {
      if (confirm("هل أنت تأكد من رغبتك في حذف هذا المنتج؟")) {
        const db = window.firebase.database();
        window.firebase.remove(window.firebase.ref(db, 'aldabbagh_store_final/products/' + key))
          .then(() => alert("تم حذف المنتج"))
          .catch(err => alert("خطأ في الحذف: " + err.message));
      }
    }
  </script>
</body>
</html>
