<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#1E3A8A" />
  <title>محلات الدباغ</title>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from 'https://cdn.jsdelivr.net/npm/@firebase/app@0.10.0/+esm';
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://cdn.jsdelivr.net/npm/@firebase/auth@1.7.0/+esm';
    import { getDatabase, ref, onValue, push, set, update, remove, child, query, orderByChild, limitToLast, limitToFirst, onChildAdded, onChildRemoved, onDisconnect, get as dbGet, startAt, endAt, equalTo } from 'https://cdn.jsdelivr.net/npm/@firebase/database@1.0.4/+esm';

    const firebaseConfig = {
      apiKey: "AIzaSyC-QqnQTbbyVFS8QFkf4CYZTcURcr9nBW0",
      authDomain: "gimi-fd7fe.firebaseapp.com",
      databaseURL: "https://gimi-fd7fe-default-rtdb.firebaseio.com",
      projectId: "gimi-fd7fe",
      storageBucket: "gimi-fd7fe.firebasestorage.app",
      messagingSenderId: "642364940251",
      appId: "1:642364940251:web:6dd47f47d500ae9ed791fe"
    };

    const app = initializeApp(firebaseConfig);
    const realAuth = getAuth(app);
    const database = getDatabase(app);

    function makeRefFactory() {
      const subs = [];
      function track(u) { if (u) subs.push(u); return u; }
      function makeRef(v10Ref) {
        return {
          child: (path) => makeRef(child(v10Ref, path)),
          push: (value) => { const newRef = push(v10Ref); const nw = makeRef(newRef); if (value !== undefined) nw.set(value); return nw; },
          set: (value) => set(v10Ref, value),
          update: (values) => update(v10Ref, values),
          remove: () => remove(v10Ref),
          on: (event, cb, errCb) => {
            if (event === 'value') return track(onValue(v10Ref, cb, errCb));
            if (event === 'child_added') return track(onChildAdded(v10Ref, cb));
            if (event === 'child_removed') return track(onChildRemoved(v10Ref, cb));
            return track(() => {});
          },
          off: () => { subs.forEach(u => u()); subs.length = 0; },
          once: () => dbGet(v10Ref),
          onDisconnect: () => { const od = onDisconnect(v10Ref); return { remove: () => od.remove(), set: (v) => od.set(v), cancel: () => od.cancel() }; },
          orderByChild: (path) => makeQuery(query(v10Ref, orderByChild(path))),
          limitToLast: (n) => makeQuery(query(v10Ref, limitToLast(n))),
          limitToFirst: (n) => makeQuery(query(v10Ref, limitToFirst(n))),
          startAt: (v) => makeQuery(query(v10Ref, startAt(v))),
          endAt: (v) => makeQuery(query(v10Ref, endAt(v))),
          equalTo: (v) => makeQuery(query(v10Ref, equalTo(v)))
        };
      }
      function makeQuery(v10Query) {
        return {
          on: (event, cb) => {
            if (event === 'value') return track(onValue(v10Query, cb));
            if (event === 'child_added') return track(onChildAdded(v10Query, cb));
            if (event === 'child_removed') return track(onChildRemoved(v10Query, cb));
            return track(() => {});
          },
          orderByChild: (p) => makeQuery(query(v10Query, orderByChild(p))),
          limitToLast: (n) => makeQuery(query(v10Query, limitToLast(n))),
          limitToFirst: (n) => makeQuery(query(v10Query, limitToFirst(n)))
        };
      }
      return makeRef;
    }

    window.firebase = {
      initializeApp: () => app,
      auth: () => ({
        get currentUser() { return realAuth.currentUser; },
        signInAnonymously: () => signInAnonymously(realAuth),
        signInWithEmailAndPassword: (email, password) => signInWithEmailAndPassword(realAuth, email, password),
        signOut: () => signOut(realAuth),
        onAuthStateChanged: (cb) => onAuthStateChanged(realAuth, cb),
        setPersistence: () => Promise.resolve()
      }),
      database: () => ({ ref: (path) => makeRefFactory()(path ? ref(database, path) : ref(database)) })
    };
    window.__firebaseReady = true;
    console.log('%c[Module] ✅ Firebase ready', 'color:green;font-weight:bold');
  </script>

  <!-- QR Code Scanner Lib -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;600;700;800&family=Almarai:wght@400;700;800&family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Amiri:wght@400;700&family=Rubik:wght@400;600;700&family=Changa:wght@400;600;700&family=El+Messiri:wght@400;600;700&family=Cairo+Play:wght@400;700;900&family=Lalezar&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #F1F5F9; --card-bg: #FFFFFF; --stripe-bg: #F8FAFC; --border-color: #E2E8F0;
      --text-main: #0F172A; --text-muted: #64748B; --primary: #1E3A8A; --price-blue: #2563EB;
      --cost-color: #475569; --success: #059669; --success-bg: #ECFDF5; --danger: #DC2626;
      --danger-bg: #FEF2F2; --brass: #D97706; --warning: #D97706; --warning-bg: #FEF3C7;
      --wholesale: #7C3AED; --wholesale-bg: #F5F3FF;
      --radius: 12px; --radius-sm: 8px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --font-body: 'Tajawal', sans-serif; --font-size-base: 15.5px; --low-stock-threshold: 5;
    }
    body.dark-mode {
      --bg-main: #0B1120; --card-bg: #1E293B; --stripe-bg: #182232; --border-color: #334155;
      --text-main: #F8FAFC; --text-muted: #94A3B8; --primary: #3B82F6; --price-blue: #60A5FA;
      --cost-color: #CBD5E1; --success: #34D399; --success-bg: rgba(5, 150, 105, 0.15);
      --danger: #F87171; --danger-bg: rgba(220, 38, 38, 0.15);
      --warning: #FBBF24; --warning-bg: rgba(217, 119, 6, 0.15);
      --wholesale: #A78BFA;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body); background: var(--bg-main); color: var(--text-main);
      margin: 0; padding: 0; direction: rtl; font-size: var(--font-size-base); line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); color: #F8FAFC;
      padding: 18px 30px; font-size: 21px; font-weight: 800; border-bottom: 4px solid var(--brass);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;
    }
    header.admin-active { border-bottom-color: var(--success); }
    .container { max-width: 1480px; margin: 24px auto; padding: 0 20px; }
    #cloudStatus {
      padding: 12px 18px; text-align: center; font-weight: 700; border-radius: var(--radius);
      margin-bottom: 20px; background: var(--card-bg); color: var(--text-muted); font-size: 0.95em;
      border: 1px dashed var(--border-color); font-family: 'IBM Plex Mono', monospace;
    }
    #cloudStatus.online { color: var(--success); border-color: var(--success); }
    #cloudStatus.offline { color: var(--danger); border-color: var(--danger); }
    
    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: block !important; }
    body.is-admin th.admin-only, body.is-admin td.admin-only { display: table-cell !important; }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    button { padding: 12px 18px; border: none; border-radius: var(--radius-sm); color: white; font-weight: 800; cursor: pointer; font-size: 1em; font-family: var(--font-body); }
    .btn-price { background: var(--price-blue); }
    .btn-success { background: var(--success); }

    /* Toast Container */
    #toastContainer { position: fixed; bottom: 20px; left: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: #1E293B; color: #FFF; padding: 14px 24px; border-radius: var(--radius-sm); font-size: 0.95em; font-weight: 700; max-width: 320px; pointer-events: auto; border-inline-start: 4px solid var(--price-blue); }
    
    /* Chat FAB */
    #chatFab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--price-blue); color: #fff; font-size: 1.6em; cursor: pointer; z-index: 999; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .chat-badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 0.65em; font-weight: 800; min-width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid #fff; padding: 0 4px; }
  </style>
</head>
<body>

  <header>
    <div>🛒 محلات الدباغ - النظام الإداري المتكامل</div>
    <div id="adminBadge" class="admin-only" style="background: var(--success); padding: 4px 12px; border-radius: 20px; font-size: 0.75em;">وضع المشرف مفعل (Admin)</div>
  </header>

  <div class="container">
    <div id="cloudStatus" class="offline">جاري الاتصال بقاعدة البيانات والتحقق من الصلاحيات...</div>

    <div class="card">
      <h2>لوحة التحكم والمنتجات</h2>
      <p>أهلاً بك في النظام. قم بتسجيل الدخول أو استخدم التطبيق بشكل طبيعي. سيتم التحقق من صلاحياتك الإدارية تلقائياً.</p>
      <button class="btn-price" onclick="testLoginAnonymously()">تسجيل دخول تجريبي (زائر)</button>
    </div>
  </div>

  <!-- Chat Floating Action Button -->
  <button id="chatFab" onclick="toggleChatModal()">
    💬
    <span id="chatBadge" class="chat-badge">0</span>
  </button>

  <div id="toastContainer"></div>

  <script>
    // 1. صوت التنبيه للدردشة
    const chatNotificationSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    function playNotificationSound() {
      chatNotificationSound.currentTime = 0;
      chatNotificationSound.play().catch(err => console.log("تم حظر التشغيل التلقائي للصوت:", err));
    }

    // 2. إشعارات سطح المكتب (Desktop Notification)
    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
      }
    }

    function showDesktopNotification(senderName, text) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(`رسالة جديدة من: ${senderName || 'مستخدم'}`, {
          body: text,
          icon: 'https://cdn-icons-png.flaticon.com/512/733/733585.png',
          dir: 'rtl'
        });
      }
    }

    // تشغيل طلب الإذن عند أول تفاعل
    window.addEventListener('click', () => {
      requestNotificationPermission();
    }, { once: true });

    // 3. التحقق التلقائي من حالة الدخول وصلاحيات الـ Admin
    window.addEventListener('DOMContentLoaded', () => {
      if (!window.__firebaseReady) {
        document.getElementById('cloudStatus').innerText = "❌ خطأ في تحميل مكتبة Firebase";
        return;
      }

      const auth = window.firebase.auth();
      const db = window.firebase.database();

      // تسجيل دخول تجريبي تلقائي للمتابعة إذا لم يكن مسجلاً
      auth.signInAnonymously().catch(err => console.error("خطأ في المصادقة:", err));

      auth.onAuthStateChanged((user) => {
        const statusEl = document.getElementById('cloudStatus');
        if (user) {
          statusEl.className = "online";
          statusEl.innerText = `🟢 متصل بالإنترنت (معرف المستخدم: ${user.uid})`;

          // التحقق من عقدة admins في قاعدة البيانات
          db.ref('admins/' + user.uid).on('value', (snapshot) => {
            if (snapshot.val() === true) {
              document.body.classList.add('is-admin');
              console.log("🔓 تم تفعيل وضع المشرف (Admin) بنجاح.");
            } else {
              document.body.classList.remove('is-admin');
              console.log("🔒 تم تسجيل الدخول كمستخدم عادي.");
            }
          });

          // الاستماع للرسائل الجديدة في الدردشة لتفعيل التنبيهات
          initChatListener(user.uid, db);

        } else {
          statusEl.className = "offline";
          statusEl.innerText = "🔴 غير مسجل الدخول";
          document.body.classList.remove('is-admin');
        }
      });
    });

    function testLoginAnonymously() {
      window.firebase.auth().signInAnonymously()
        .then(() => alert("تم تسجيل الدخول بنجاح!"))
        .catch(err => alert("فشل تسجيل الدخول: " + err.message));
    }

    function toggleChatModal() {
      alert("نافذة الدردشة المباشرة (يمكنك ربطها بواجهة الدردشة الخاصة بك هنا).");
    }

    // 4. مراقبة رسائل الدردشة وتشغيل التنبيهات والصوت
    function initChatListener(currentUserId, db) {
      db.ref('aldabbagh_store_final/chat_messages').on('child_added', (snapshot) => {
        const msg = snapshot.val();
        if (msg && msg.senderId && msg.senderId !== currentUserId) {
          playNotificationSound();
          showDesktopNotification(msg.senderName, msg.text);
        }
      });
    }
  </script>
</body>
</html>
